plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

group = 'dev.nishu.bettercosmic'
version = project.bettercosmic_version

base {
	archivesName = 'bettercosmic'
}

repositories {
	// ModMenu, for the optional mod-list config-screen integration.
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	// Client-only mod: a single `main` source set (with access to client-only Minecraft classes),
	// same as the shared library. No split environment source sets. This one module carries both
	// feature sets (BetterPrisons + BetterSky), each gated at runtime to its own Cosmic network.
	accessWidenerPath = file("src/main/resources/bettercosmic.accesswidener")

	mods {
		"bettercosmic" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Two independent client runs so each Cosmic network can be tested in isolation. They share
		// the same mod build (BetterCosmic loads both feature sets and gates them by the connected
		// network), but each has its OWN run directory — so its saves, config, logs, and companion
		// mods stay separate. Drop network-specific companion mods into the run dir's `mods/` folder:
		//   run-prisons/mods/   and   run-sky/mods/
		// Fabric loads those alongside the dev mod, per run. Regenerate IDE configs with:
		//   ./gradlew :bettercosmic:genIntellijRuns
		//
		// Task names: ./gradlew :bettercosmic:runPrisonsClient   and   :bettercosmic:runSkyClient
		prisonsClient {
			client()
			name = "BetterCosmic (Prisons)"
			runDir "run-prisons"
			ideConfigGenerated true
		}
		skyClient {
			client()
			name = "BetterCosmic (Sky)"
			runDir "run-sky"
			ideConfigGenerated true
		}
		// This is a client-only mod; don't clutter the IDE with a server run config.
		server {
			ideConfigGenerated false
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu — optional integration (compile against it; if a user doesn't have ModMenu the
	// entrypoint simply never loads). Not bundled; users supply their own copy.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Shared library: `namedElements` gives the dev-mapped classes for compile/run; `include`
	// bundles the remapped jar into the BetterCosmic jar as a Jar-in-Jar nested mod so that
	// bettercosmicshared's mixins and access-widener are applied at runtime.
	implementation project(path: ":shared", configuration: "namedElements")
	include project(":shared")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName
			from components.java
		}
	}
	repositories {
	}
}
