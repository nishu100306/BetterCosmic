<title>BetterCosmic Config UI — Mockup</title>
<style>
  :root{
    --bg-0:#06070c; --bg-1:#0b0e16;
    --surface:rgba(14,18,28,.72);
    --surface-2:rgba(19,25,39,.82);
    --surface-3:rgba(24,31,48,.9);
    --line:rgba(150,172,210,.16);
    --line-strong:rgba(150,172,210,.30);
    --text:#e7ecf4; --muted:#8b95a9; --faint:#545d70;
    --accent:#57d4e6; --accent-soft:rgba(87,212,230,.16); --accent-line:rgba(87,212,230,.55);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,monospace;
    --r:3px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg-0);
    color:var(--text);
    font-family:var(--sans);
    font-size:12px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100%;
  }

  /* ---------- Cosmic "world" behind the GUI ---------- */
  .stage{
    position:relative; flex:1 1 auto;
    min-height:560px;
    display:grid; place-items:center;
    padding:28px 20px;
    overflow:hidden;
    background:
      radial-gradient(1200px 500px at 72% -8%, rgba(87,212,230,.10), transparent 60%),
      radial-gradient(900px 600px at 15% 115%, rgba(120,96,220,.14), transparent 62%),
      linear-gradient(180deg,#0a0c16 0%,#070810 55%,#050509 100%);
  }
  .stars{position:absolute; inset:0; pointer-events:none; opacity:.9}
  .horizon{
    position:absolute; left:0; right:0; bottom:0; height:34%;
    background:linear-gradient(180deg,transparent, rgba(10,14,26,.55) 70%, rgba(6,8,14,.9));
    pointer-events:none;
  }

  /* ---------- Config root ---------- */
  .config{
    position:relative; z-index:2;
    width:min(680px,100%);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r);
    backdrop-filter:blur(9px) saturate(1.05);
    -webkit-backdrop-filter:blur(9px) saturate(1.05);
    box-shadow:0 24px 70px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.35);
    display:flex; flex-direction:column;
  }
  .config__head{
    display:flex; align-items:center; gap:9px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
  }
  .mark{
    width:16px;height:16px;color:var(--accent);flex:none;
    filter:drop-shadow(0 0 5px rgba(87,212,230,.5));
  }
  .wordmark{display:flex; align-items:baseline; gap:6px; letter-spacing:.2px}
  .wordmark b{font-weight:650; font-size:13px}
  .wordmark span{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.14em}
  .config__head .spacer{flex:1}
  .headbtn{
    color:var(--faint); font-size:11px; background:none;border:none;cursor:pointer;
    padding:3px 6px;border-radius:2px;
  }
  .headbtn:hover{color:var(--text)}

  /* ---------- Panel grid ---------- */
  .gridwrap{padding:14px}
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:9px;
  }
  .grid[hidden]{display:none}
  .panel{
    position:relative; text-align:left;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--r);
    padding:11px 11px 10px;
    min-height:98px;
    display:flex; flex-direction:column; gap:6px;
    cursor:pointer; color:inherit; font:inherit;
    transition:border-color .12s, transform .12s, background .12s;
  }
  .panel:hover{border-color:var(--accent-line); background:var(--surface-3); transform:translateY(-1px)}
  .panel:focus-visible{outline:1px solid var(--accent); outline-offset:1px}
  .panel__icon{width:17px;height:17px;color:var(--accent);opacity:.92}
  .panel__title{font-weight:600; font-size:12px}
  .panel__desc{font-size:10.5px; color:var(--muted); line-height:1.3}
  .panel__meta{
    margin-top:auto; display:flex; align-items:center; gap:6px;
    font-size:9.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.1em;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 5px rgba(87,212,230,.7);flex:none}

  .panel.locked{cursor:not-allowed; background:rgba(16,20,30,.5)}
  .panel.locked:hover{border-color:var(--line); background:rgba(16,20,30,.5); transform:none}
  .panel.locked .panel__icon,.panel.locked .panel__title{color:var(--faint);opacity:.8}
  .panel.locked .panel__desc{color:#4a5162}
  .soon{
    align-self:flex-start;margin-top:auto;
    font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--line);border-radius:2px;padding:2px 5px;
  }

  /* ---------- Footer / pagination ---------- */
  .config__foot{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px; border-top:1px solid var(--line);
  }
  .pager{display:flex; align-items:center; gap:4px}
  .pgbtn{
    width:22px;height:20px;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--line);border-radius:2px;
    color:var(--muted);cursor:pointer;transition:border-color .12s,color .12s;
  }
  .pgbtn:hover{color:var(--text);border-color:var(--line-strong)}
  .pgbtn:disabled{opacity:.35;cursor:default}
  .pgbtn svg{width:9px;height:9px}
  .pgnum{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 6px;min-width:64px;text-align:center}
  .dots{display:flex;gap:4px}
  .pgdot{width:5px;height:5px;border-radius:50%;background:var(--faint);opacity:.5}
  .pgdot.on{background:var(--accent);opacity:1;box-shadow:0 0 5px rgba(87,212,230,.6)}
  .done{
    font-size:11px;color:var(--muted);background:none;border:1px solid var(--line);
    padding:4px 12px;border-radius:2px;cursor:pointer;transition:.12s;
  }
  .done:hover{color:var(--text);border-color:var(--accent-line)}

  /* ---------- Popup ---------- */
  .scrim{
    position:absolute; inset:0; z-index:5;
    display:none; place-items:center; padding:20px;
    background:rgba(4,5,10,.5);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
  }
  .scrim.open{display:grid}
  .popup{
    width:min(360px,100%); max-height:88%;
    background:var(--surface-3);
    border:1px solid var(--line-strong);
    border-radius:var(--r);
    box-shadow:0 30px 80px -24px rgba(0,0,0,.9);
    backdrop-filter:blur(14px) saturate(1.1);
    -webkit-backdrop-filter:blur(14px) saturate(1.1);
    display:flex; flex-direction:column; overflow:hidden;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
  .popup__head{
    display:flex; align-items:center; gap:8px;
    padding:9px 11px; border-bottom:1px solid var(--line);
  }
  .popup__head .picon{width:15px;height:15px;color:var(--accent)}
  .popup__head h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.2px}
  .popup__head .x{
    margin-left:auto;width:18px;height:18px;display:grid;place-items:center;
    border:none;background:none;color:var(--faint);cursor:pointer;border-radius:2px;font-size:13px;line-height:1;
  }
  .popup__head .x:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .popup__body{padding:6px 11px 11px; overflow-y:auto}

  .grouplabel{
    font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
    padding:11px 0 5px; border-bottom:1px solid var(--line); margin-bottom:3px;
  }
  .group:first-child .grouplabel{padding-top:4px}
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:6px 0; min-height:26px;
  }
  .row + .row{border-top:1px solid rgba(150,172,210,.06)}
  .row__label{font-size:11.5px; color:var(--text)}
  .row__ctl{flex:none; display:flex; align-items:center; gap:8px}

  /* toggle */
  .tgl{width:26px;height:14px;border-radius:8px;border:1px solid var(--line-strong);
    background:rgba(120,132,155,.18);position:relative;cursor:pointer;transition:.14s;padding:0}
  .tgl .knob{position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;
    background:#c7cede;transition:.14s}
  .tgl[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line)}
  .tgl[aria-pressed="true"] .knob{left:13px;background:var(--accent);box-shadow:0 0 6px rgba(87,212,230,.7)}

  /* slider */
  .sld{display:flex;align-items:center;gap:8px}
  .sld input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:14px;background:none;cursor:pointer}
  .sld input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent) var(--pct,50%),rgba(120,132,155,.3) var(--pct,50%))}
  .sld input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(120,132,155,.3)}
  .sld input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
  .sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:2px;
    background:var(--accent);margin-top:-3px;box-shadow:0 0 6px rgba(87,212,230,.6)}
  .sld input[type=range]::-moz-range-thumb{width:8px;height:8px;border:none;border-radius:2px;background:var(--accent)}
  .sld .val{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}

  /* dropdown */
  .dd{position:relative}
  .dd__btn{display:flex;align-items:center;gap:7px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:2px;color:var(--text);font:inherit;font-size:11px;
    padding:3px 6px;cursor:pointer;min-width:104px;justify-content:space-between}
  .dd__btn:hover{border-color:var(--line-strong)}
  .dd__btn svg{width:8px;height:8px;color:var(--muted)}
  .dd__list{position:absolute;right:0;top:calc(100% + 3px);z-index:3;min-width:120px;
    background:var(--surface-3);border:1px solid var(--line-strong);border-radius:2px;
    box-shadow:0 14px 34px -14px rgba(0,0,0,.85);padding:2px;display:none}
  .dd.open .dd__list{display:block}
  .dd__opt{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    padding:4px 6px;border-radius:2px;cursor:pointer}
  .dd__opt:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .dd__opt.sel{color:var(--accent)}
  .dd__opt .tick{width:7px;height:7px;flex:none}

  /* color */
  .color{display:flex;align-items:center;gap:7px;position:relative}
  .swatch{width:9px;height:9px;border-radius:1px;border:1px solid rgba(255,255,255,.35);
    box-shadow:0 0 0 1px rgba(0,0,0,.5);cursor:pointer;flex:none}
  .hex{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .cpop{position:absolute;right:0;top:calc(100% + 5px);z-index:6;width:150px;
    background:var(--surface-3);border:1px solid var(--line-strong);border-radius:3px;padding:8px;
    box-shadow:0 18px 44px -16px rgba(0,0,0,.9);display:none}
  .color.open .cpop{display:block}
  .sv{height:74px;border-radius:2px;border:1px solid var(--line);position:relative;margin-bottom:7px;cursor:crosshair;
    background:linear-gradient(180deg,transparent,#000),linear-gradient(90deg,#fff,hsl(var(--h,190) 90% 50%))}
  .sv .pick{position:absolute;width:7px;height:7px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);top:18%;left:82%}
  .hue{height:8px;border-radius:2px;border:1px solid var(--line);margin-bottom:7px;position:relative;cursor:pointer;
    background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .hue .pick{position:absolute;top:-2px;width:4px;height:12px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.7);transform:translateX(-50%);left:53%}
  .cpop .hexrow{display:flex;align-items:center;gap:6px}
  .cpop .hexrow label{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em}
  .field{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;color:var(--text);
    font-family:var(--mono);font-size:11px;padding:3px 6px;text-transform:uppercase}
  .field:focus{outline:none;border-color:var(--accent-line)}

  /* keybind */
  .keybind{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);
    border:1px solid var(--line);border-radius:2px;padding:3px 9px;cursor:pointer;min-width:66px;text-align:center}
  .keybind:hover{border-color:var(--line-strong);color:var(--text)}
  .keybind.listening{color:var(--accent);border-color:var(--accent-line)}

  /* ---------- annotation strip ---------- */
  .legend{
    flex:none; border-top:1px solid var(--line);
    background:var(--bg-1);
    display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
    padding:9px 16px; font-size:10.5px; color:var(--muted);
  }
  .legend b{color:var(--text);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .chip .k{width:10px;height:10px;border-radius:2px;border:1px solid var(--line-strong)}
  .legend .accentk{background:var(--accent)}
  .legend .sep{color:var(--faint)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:560px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .wordmark span{display:none}
  }
</style>

<div class="stage">
  <canvas class="stars"></canvas>
  <div class="horizon"></div>

  <div class="config" role="dialog" aria-label="BetterCosmic configuration">
    <div class="config__head">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 21l-5.1 3 1.1-5.7-4.3-4 5.8-.7z"/></svg>
      <span class="wordmark"><b>BetterCosmic</b><span>Sky</span></span>
      <span class="spacer"></span>
      <button class="headbtn">Reset all</button>
    </div>

    <div class="gridwrap">
      <div class="grid" data-page="0"></div>
      <div class="grid" data-page="1" hidden></div>
    </div>

    <div class="config__foot">
      <div class="pager">
        <button class="pgbtn" id="prev" aria-label="Previous page"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg></button>
        <span class="pgnum" id="pgnum">Page 1 / 2</span>
        <button class="pgbtn" id="next" aria-label="Next page"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg></button>
        <span class="dots"><i class="pgdot on"></i><i class="pgdot"></i></span>
      </div>
      <button class="done">Done</button>
    </div>

    <!-- popup layer scoped to the config so it dims only the grid -->
    <div class="scrim" id="scrim">
      <div class="popup" id="popup" role="dialog" aria-modal="true"></div>
    </div>
  </div>
</div>

<div class="legend">
  <span class="chip"><b>Mockup</b> — locks the look before the in-game build</span>
  <span class="sep">·</span>
  <span class="chip"><span class="k accentk"></span> accent <span style="font-family:var(--mono)">#57D4E6</span></span>
  <span class="chip"><span class="k"></span> 1px hairline borders</span>
  <span class="chip">10–12px type</span>
  <span class="chip">2px color swatch</span>
  <span class="sep">·</span>
  <span class="chip">click <b>Trinkets</b> or <b>General</b> to open a feature popup</span>
</div>

<script>
(function(){
  "use strict";
  // ---- icons ----
  const I = {
    flask:'<path d="M9 3h6M10 3v6l-4.5 8.2A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-2.8L14 9V3"/><path d="M7.5 14h9"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
    lock:'<rect x="5" y="10.5" width="14" height="9.5" rx="1.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
    tick:'<path d="M2.5 6.2 5 8.6l4.5-5"/>'
  };
  const svg = (p,w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  // ---- data: real panels + placeholders ----
  const REAL = {
    trinkets:{ title:'Trinkets', icon:I.flask, desc:'Potion trinket charge overlay', settings:5, groups:[
      {label:'Overlay', rows:[
        {t:'toggle', l:'Charge overlay', v:true},
        {t:'slider', l:'Scale', v:0.70, min:0.30, max:1.50, step:0.05},
        {t:'dropdown', l:'Position', v:'Bottom-left', opts:['Top-left','Top-right','Bottom-left','Bottom-right','Center']},
      ]},
      {label:'Color', rows:[
        {t:'dropdown', l:'Source', v:'Potion color', opts:['Potion color','Custom']},
        {t:'color', l:'Custom color', v:'#ffffff'},
      ]},
    ]},
    general:{ title:'General', icon:I.gear, desc:'Access, formatting & theme', settings:6, groups:[
      {label:'Access', rows:[
        {t:'keybind', l:'Open config', v:'Unbound'},
      ]},
      {label:'Formatting', rows:[
        {t:'toggle', l:'Comma number format', v:false},
      ]},
      {label:'Developer', rows:[
        {t:'toggle', l:'Developer mode', v:false},
      ]},
      {label:'Theme', rows:[
        {t:'color', l:'Accent', v:'#57d4e6'},
        {t:'color', l:'Background', v:'#0e121c'},
      ]},
    ]},
  };
  const SOON = ['HUD','Waypoints','Notifications','Chat','Minimap','Rendering','Inventory','Combat','Events','Misc'];

  const pages = [
    [ {k:'trinkets'}, {k:'general'}, {soon:'HUD'}, {soon:'Waypoints'}, {soon:'Notifications'}, {soon:'Chat'} ],
    [ {soon:'Minimap'}, {soon:'Rendering'}, {soon:'Inventory'}, {soon:'Combat'}, {soon:'Events'}, {soon:'Misc'} ],
  ];

  const grids = [...document.querySelectorAll('.grid')];
  pages.forEach((page, pi)=>{
    const g = grids[pi];
    page.forEach(cell=>{
      if(cell.k){
        const d = REAL[cell.k];
        const b = document.createElement('button');
        b.className='panel'; b.dataset.key=cell.k;
        b.innerHTML = `<div class="panel__icon">${svg(d.icon)}</div>
          <div class="panel__title">${d.title}</div>
          <div class="panel__desc">${d.desc}</div>
          <div class="panel__meta"><span class="dot"></span>${d.settings} settings</div>`;
        b.addEventListener('click', ()=>openPopup(cell.k));
        g.appendChild(b);
      } else {
        const b = document.createElement('button');
        b.className='panel locked'; b.disabled=true;
        b.innerHTML = `<div class="panel__icon">${svg(I.lock,1.5)}</div>
          <div class="panel__title">${cell.soon}</div>
          <div class="panel__desc">Not yet available</div>
          <span class="soon">Coming soon</span>`;
        g.appendChild(b);
      }
    });
  });

  // ---- pagination ----
  let page=0;
  const prev=document.getElementById('prev'), next=document.getElementById('next');
  const pgnum=document.getElementById('pgnum'), dots=[...document.querySelectorAll('.pgdot')];
  function render(){
    grids.forEach((g,i)=>g.hidden = i!==page);
    pgnum.textContent = `Page ${page+1} / ${pages.length}`;
    dots.forEach((d,i)=>d.classList.toggle('on', i===page));
    prev.disabled = page===0; next.disabled = page===pages.length-1;
  }
  prev.onclick=()=>{ if(page>0){page--;render();} };
  next.onclick=()=>{ if(page<pages.length-1){page++;render();} };
  render();

  // ---- popup ----
  const scrim=document.getElementById('scrim'), popup=document.getElementById('popup');
  function openPopup(key){
    const d=REAL[key];
    let html = `<div class="popup__head"><span class="picon">${svg(d.icon)}</span><h2>${d.title}</h2>
      <button class="x" aria-label="Close">✕</button></div><div class="popup__body">`;
    d.groups.forEach(gr=>{
      html += `<div class="group"><div class="grouplabel">${gr.label}</div>`;
      gr.rows.forEach(r=> html += rowHtml(r));
      html += `</div>`;
    });
    html += `</div>`;
    popup.innerHTML=html;
    scrim.classList.add('open');
    popup.querySelector('.x').onclick=close;
    wire(popup);
  }
  function close(){ scrim.classList.remove('open'); }
  scrim.addEventListener('mousedown', e=>{ if(e.target===scrim) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });

  function rowHtml(r){
    let ctl='';
    if(r.t==='toggle'){
      ctl=`<button class="tgl" role="switch" aria-pressed="${r.v}"><span class="knob"></span></button>`;
    } else if(r.t==='slider'){
      const pct=((r.v-r.min)/(r.max-r.min)*100).toFixed(1);
      ctl=`<span class="sld"><input type="range" min="${r.min}" max="${r.max}" step="${r.step}" value="${r.v}" style="--pct:${pct}%"><span class="val">${r.v.toFixed(2)}</span></span>`;
    } else if(r.t==='dropdown'){
      const opts=r.opts.map(o=>`<div class="dd__opt ${o===r.v?'sel':''}" data-v="${o}"><span class="tick">${o===r.v?svg(I.tick,2):''}</span>${o}</div>`).join('');
      ctl=`<div class="dd"><button class="dd__btn"><span class="ddv">${r.v}</span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button><div class="dd__list">${opts}</div></div>`;
    } else if(r.t==='color'){
      ctl=`<span class="color"><span class="swatch" style="background:${r.v}"></span><span class="hex">${r.v}</span>
        <span class="cpop"><span class="sv"><span class="pick"></span></span><span class="hue"><span class="pick"></span></span>
        <span class="hexrow"><label>Hex</label><input class="field" value="${r.v.toUpperCase()}" maxlength="7"></span></span></span>`;
    } else if(r.t==='keybind'){
      ctl=`<button class="keybind">${r.v}</button>`;
    }
    return `<div class="row"><span class="row__label">${r.l}</span><span class="row__ctl">${ctl}</span></div>`;
  }

  function wire(root){
    root.querySelectorAll('.tgl').forEach(t=>t.onclick=()=>t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')!=='true'));
    root.querySelectorAll('.sld input').forEach(inp=>inp.oninput=()=>{
      const v=parseFloat(inp.value), pct=((v-inp.min)/(inp.max-inp.min)*100).toFixed(1);
      inp.style.setProperty('--pct',pct+'%');
      inp.parentElement.querySelector('.val').textContent=v.toFixed(2);
    });
    root.querySelectorAll('.dd').forEach(dd=>{
      const btn=dd.querySelector('.dd__btn');
      btn.onclick=e=>{ e.stopPropagation(); closeAll(dd); dd.classList.toggle('open'); };
      dd.querySelectorAll('.dd__opt').forEach(o=>o.onclick=()=>{
        dd.querySelector('.ddv').textContent=o.dataset.v;
        dd.querySelectorAll('.dd__opt').forEach(x=>{x.classList.remove('sel');x.querySelector('.tick').innerHTML='';});
        o.classList.add('sel'); o.querySelector('.tick').innerHTML=svg(I.tick,2);
        dd.classList.remove('open');
      });
    });
    root.querySelectorAll('.color').forEach(c=>{
      const sw=c.querySelector('.swatch'), hex=c.querySelector('.hex'), field=c.querySelector('.field');
      c.querySelector('.swatch').onclick=e=>{ e.stopPropagation(); closeAll(c); c.classList.toggle('open'); };
      c.querySelector('.hex').onclick=e=>{ e.stopPropagation(); closeAll(c); c.classList.toggle('open'); };
      field.onclick=e=>e.stopPropagation();
      field.oninput=()=>{ let val=field.value.trim(); if(/^#?[0-9a-fA-F]{6}$/.test(val)){ if(val[0]!=='#')val='#'+val; sw.style.background=val; hex.textContent=val.toUpperCase(); } };
    });
    root.querySelectorAll('.keybind').forEach(k=>k.onclick=()=>{
      k.classList.add('listening'); const prev=k.textContent; k.textContent='Press a key…';
      const h=ev=>{ ev.preventDefault(); k.textContent=(ev.key===' '?'Space':ev.key.length===1?ev.key.toUpperCase():ev.key); k.classList.remove('listening'); document.removeEventListener('keydown',h,true); };
      document.addEventListener('keydown',h,true);
    });
  }
  function closeAll(except){
    popup.querySelectorAll('.dd.open,.color.open').forEach(x=>{ if(x!==except) x.classList.remove('open'); });
  }
  popup.addEventListener('click', ()=>closeAll(null));

  // ---- starfield ----
  const cv=document.querySelector('.stars'), cx=cv.getContext('2d');
  function stars(){
    const w=cv.width=cv.offsetWidth*devicePixelRatio, h=cv.height=cv.offsetHeight*devicePixelRatio;
    cx.clearRect(0,0,w,h);
    const n=Math.min(220, Math.round(w*h/16000));
    for(let i=0;i<n;i++){
      const x=Math.random()*w, y=Math.random()*h*0.86, r=Math.random()*1.3*devicePixelRatio;
      const a=Math.random()*0.7+0.15;
      cx.beginPath(); cx.arc(x,y,r,0,7);
      cx.fillStyle=`rgba(${200+Math.random()*40|0},${215+Math.random()*30|0},255,${a})`; cx.fill();
    }
  }
  stars(); addEventListener('resize', stars);
})();
</script>
