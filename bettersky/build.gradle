plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

group = 'dev.nishu.bettercosmic'
version = project.bettersky_version

base {
	archivesName = 'bettersky'
}

repositories {
	// Add repositories to retrieve artifacts from in here (only for mod dependencies).
}

loom {
	// Client-only mod: a single `main` source set (with access to client-only Minecraft classes),
	// same as the shared library. No split environment source sets.
	mods {
		"bettersky" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Client run for BetterSky. Uses this module's own `bettersky/run` working directory,
		// separate from the other modules' run dirs. Regenerate the IDE config with:
		//   ./gradlew :bettersky:genIntellijRuns
		client {
			name = "BetterSky Client"
			runDir "run"
			ideConfigGenerated true
		}
		// This is a client-only mod; don't clutter the IDE with a server run config.
		server {
			ideConfigGenerated false
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Shared library: `namedElements` gives the dev-mapped classes for compile/run; `include`
	// bundles the remapped jar into the BetterSky jar as a Jar-in-Jar nested mod so that
	// bettercosmicshared's mixins and access-widener are applied at runtime.
	implementation project(path: ":shared", configuration: "namedElements")
	include project(":shared")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName
			from components.java
		}
	}
	repositories {
	}
}
